<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultrasound Subjective Evaluation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="forms-topbar"></div>
  <main class="page-shell">
    <section class="form-card form-header">
      <h1>Ultrasound Subjective Evaluation</h1>
      <p>超音波影像主觀評分平台。請選擇固定評分者後開始作答。</p>
      <div class="notice">模型名稱已匿名顯示為 Model A–E，避免評分者得知真實模型名稱。</div>
    </section>

    <section class="form-card question-card">
      <label class="question-title" for="reviewerSelect">Reviewer</label>
      <select id="reviewerSelect" class="select-input" aria-label="Reviewer">
        <option value="Reviewer1">Reviewer1</option>
        <option value="Reviewer2">Reviewer2</option>
      </select>
    </section>

    <section class="form-card question-card">
      <div class="section-row">
        <div>
          <h2>評分任務</h2>
          <p class="muted">首頁會直接讀取 Google Drive 任務，並從 Google Sheet 載入作答進度。</p>
        </div>
        <a class="ghost-button" href="history.html">查看作答紀錄</a>
      </div>
      <div id="taskList" class="task-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
