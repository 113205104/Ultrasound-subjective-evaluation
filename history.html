<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>作答紀錄 | Ultrasound Subjective Evaluation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="forms-topbar"></div>

  <main class="page-shell">
    <section class="form-card form-header compact">
      <a class="back-link" href="index.html">← 回首頁</a>
      <h1>作答紀錄查詢</h1>
      <p>可依 Reviewer、策略、資料集與模型查看每題作答情況。</p>
    </section>

    <section class="form-card question-card">
      <div class="filter-grid">
        <label>
          Reviewer
          <select id="reviewerFilter" class="select-input"></select>
        </label>

        <label>
          Strategy
          <input id="strategyFilter" class="text-input" placeholder="例如 v7_v7">
        </label>

        <label>
          Dataset
          <input id="datasetFilter" class="text-input" placeholder="例如 v7-only">
        </label>

        <label>
          Model
          <input id="modelFilter" class="text-input" placeholder="cut / cyc / fast / p2p / reg">
        </label>
      </div>

      <div class="nav-row">
        <button id="reloadBtn" class="primary-button" type="button">查詢 / 重新整理</button>
      </div>
    </section>

    <section class="form-card question-card">
      <h2>作答紀錄</h2>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
