<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History | Ultrasound Subjective Evaluation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="forms-topbar"></div>
  <main class="page-shell">
    <section class="form-card form-header compact">
      <a class="back-link" href="index.html">← 回首頁</a>
      <h1>作答記錄查詢</h1>
      <p class="muted">依 strategy / dataset / model / reviewer 篩選，查看精簡版作答記錄。</p>
    </section>

    <section class="form-card question-card">
      <div class="filter-row">
        <div>
          <label for="reviewerFilter">Reviewer</label>
          <select id="reviewerFilter" class="select-input"></select>
        </div>
        <div>
          <label for="strategyFilter">Strategy</label>
          <input id="strategyFilter" class="select-input" type="text" placeholder="例如 cyc_v7" />
        </div>
        <div>
          <label for="datasetFilter">Dataset</label>
          <input id="datasetFilter" class="select-input" type="text" placeholder="例如 kidney" />
        </div>
        <div>
          <label for="modelFilter">Model</label>
          <input id="modelFilter" class="select-input" type="text" placeholder="例如 cyc" />
        </div>
        <div class="filter-actions">
          <button id="reloadBtn" class="primary-button" type="button">查詢</button>
        </div>
      </div>
    </section>

    <div id="historyList"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
